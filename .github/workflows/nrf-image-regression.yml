name: NRF image regression

on:
  push:
    paths:
      - 'src/dash-image.mjs'
      - 'tests/dash-image-regression.mjs'
      - '.github/workflows/nrf-image-regression.yml'
  pull_request:
    paths:
      - 'src/dash-image.mjs'
      - 'tests/dash-image-regression.mjs'
      - '.github/workflows/nrf-image-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-image-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run NRF image regression tests (no hardware)
        run: node tests/dash-image-regression.mjs
